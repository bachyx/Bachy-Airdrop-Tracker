<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BACHY AIRDROP TRACKER</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #0f0b08;
      color: #d4a017;
      font-family: 'VT323', monospace;
      min-height: 100vh;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset:0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
      pointer-events: none; z-index: 9999;
    }
    body::after {
      content: '';
      position: fixed; inset:0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
      pointer-events: none; z-index: 9998;
    }

    .container { max-width: 1100px; margin:0 auto; padding:20px; position:relative; z-index:1; }

    /* ===== HEADER ===== */
    header {
      text-align: center; margin-bottom: 28px;
      border-bottom: 3px double #9b7b1c;
      padding-bottom: 16px;
    }
    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 22px;
      color: #e8b830;
      text-shadow: 3px 3px 0 #5a3e0a, 0 0 20px #d4a01755;
      letter-spacing: 2px;
      word-break: break-word;
    }
    .subtitle {
      font-size: 14px;
      color: #7a6a3a;
      margin-top: 6px;
    }
    .header-actions { margin-top: 14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }

    /* ===== STATS ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px; margin-bottom: 20px;
    }
    .stat-card {
      background: #1a120a;
      border: 2px solid #4a3a1a;
      padding: 12px;
      text-align: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    .stat-card .label { font-size: 11px; color: #7a6a3a; text-transform:uppercase; }
    .stat-card .value { font-size: 28px; font-weight:bold; margin-top:2px; }
    .stat-card .value.gold { color: #e8b830; }
    .stat-card .value.green { color: #4caf50; }
    .stat-card .value.yellow { color: #ffc107; }
    .stat-card .value.blue { color: #5b9bd5; }
    .stat-card .value.red { color: #f44336; }

    /* ===== BUTTONS ===== */
    button {
      font-family: 'VT323', monospace;
      font-size: 15px;
      padding: 8px 18px;
      cursor: pointer;
      border: 2px solid #9b7b1c;
      background: #1a120a;
      color: #d4a017;
      transition: all 0.15s;
      text-transform:uppercase;
      letter-spacing:1px;
    }
    button:hover { background: #2a1f0e; border-color: #e8b830; color:#e8b830; text-shadow:0 0 8px #d4a01755; }
    button:active { transform:translateY(1px); }
    button.primary { background: #4a3a1a; border-color:#e8b830; }
    button.primary:hover { background: #5a4a2a; }
    button.danger { border-color:#8b3a3a; color:#c85a4a; }
    button.danger:hover { background:#2a1a1a; border-color:#c85a4a; }
    button.sm { padding:4px 10px; font-size:13px; }
    button:disabled { opacity:0.4; cursor:not-allowed; }

    /* ===== SEARCH ===== */
    .controls {
      display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
    }
    .controls input, .controls select {
      font-family: 'VT323', monospace;
      font-size: 15px;
      background: #1a120a;
      border: 2px solid #4a3a1a;
      color: #d4a017;
      padding: 8px 12px;
    }
    .controls input:focus, .controls select:focus { outline:none; border-color:#9b7b1c; }
    .controls input { flex:1; min-width:180px; }
    .controls select { min-width:100px; }


    /* ===== A-Z FILTER ===== */
    .az-bar {
      display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap;
      justify-content:center;
    }
    .az-btn {
      font-family:'VT323',monospace; font-size:12px; padding:2px 6px;
      min-width:28px; text-align:center;
      border:1px solid #4a3a1a; background:#1a120a; color:#7a6a3a;
      cursor:pointer; transition:all 0.15s;
    }
    .az-btn:hover { border-color:#9b7b1c; color:#d4a017; }
    .az-btn.az-active { background:#4a3a1a; color:#e8b830; border-color:#e8b830; }

    /* ===== TABLE ===== */
    .table-wrap {
      border: 2px solid #4a3a1a;
      background: #120e08;
      overflow-x: auto;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    table { width:100%; border-collapse:collapse; }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #2a1f0e;
      font-size: 15px;
    }
    th {
      color: #7a6a3a;
      font-weight:normal;
      text-transform:uppercase;
      font-size: 12px;
      letter-spacing:1px;
      background: #1a120a;
      border-bottom: 2px solid #4a3a1a;
    }
    tr:last-child td { border-bottom:none; }
    tr:hover { background: rgba(212,160,23,0.04); }
    .done-row td { opacity:0.35; }
    .done-row td:first-child { opacity:1; }

    input[type="checkbox"] {
      width:18px; height:18px;
      accent-color: #4caf50;
      cursor: pointer;
    }
    .logo-cell img {
      width:26px; height:26px; border-radius:50%;
      border:2px solid #4a3a1a;
      vertical-align:middle;
      display:block;
    }
    .logo-cell { width:36px; text-align:center; }
    .project-name { color: #e8b830; font-size:16px; }
    .badge-cost { color: #4caf50; }
    .badge {
      display:inline-block;
      font-size:12px;
      padding:2px 8px;
      border:1px solid currentColor;
    }
    .badge.todo { color:#5b9bd5; border-color:#3a5a8a; }
    .badge.ongoing { color:#ffc107; border-color:#8a7a0a; }
    .badge.claimed { color:#4caf50; border-color:#2a6a2a; }
    .badge.missed { color:#f44336; border-color:#8a2a2a; }
    .airdrop-link { color:#d4a017; text-decoration:none; border-bottom:1px dashed #4a3a1a; }
    .airdrop-link:hover { color:#e8b830; border-bottom-color:#e8b830; }

    .empty {
      text-align:center; padding:40px; color:#5a4a2a;
      font-size:18px;
    }

    /* ===== MODAL (retro) ===== */
    .modal-overlay {
      position:fixed; inset:0;
      background: rgba(0,0,0,0.85);
      display:none; align-items:center; justify-content:center;
      z-index:100; padding:20px;
    }
    .modal-overlay.active { display:flex; }
    .modal {
      background: #120e08;
      border: 3px double #9b7b1c;
      padding: 28px;
      width:100%; max-width:520px;
      max-height:90vh; overflow-y:auto;
      box-shadow: 0 0 40px rgba(212,160,23,0.1);
    }
    .modal h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: #e8b830;
      margin-bottom: 20px;
      line-height:1.6;
    }

    .form-group { margin-bottom:14px; }
    .form-group label {
      display:block;
      font-size:13px;
      color:#7a6a3a;
      text-transform:uppercase;
      letter-spacing:1px;
      margin-bottom:4px;
    }
    .form-group input, .form-group textarea {
      width:100%;
      font-family: 'VT323', monospace;
      font-size:16px;
      background: #1a120a;
      border: 2px solid #4a3a1a;
      color: #d4a017;
      padding: 10px 12px;
    }
    .form-group input:focus { outline:none; border-color:#9b7b1c; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }

    /* ===== IMPORT PREVIEW ===== */
    .import-status { margin-top:12px; }
    .import-loading { display:flex; align-items:center; gap:10px; padding:10px 0; color:#7a6a3a; font-size:16px; }
    .spinner {
      width:18px; height:18px;
      border:2px solid #4a3a1a;
      border-top-color:#d4a017;
      border-radius:50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .import-preview-card {
      display:flex; align-items:center; gap:14px;
      padding:14px;
      background:#1a120a;
      border:2px solid #4a3a1a;
      margin-top:8px;
    }
    .import-preview-card img {
      width:40px; height:40px; border-radius:50%;
      border:2px solid #4a3a1a;
    }
    .import-preview-card .info { font-size:16px; }
    .import-preview-card .info .name { color:#e8b830; font-size:18px; }
    .import-preview-card .info small { color:#7a6a3a; font-size:14px; }
    .import-preview-card .info .detail { color:#a08030; font-size:14px; }

    .import-error {
      background:#1a0a0a; border:2px solid #8b3a3a;
      padding:10px; color:#c85a4a; margin-top:8px;
      font-size:15px;
    }

    .hint {
      color:#5a4a2a; font-size:14px; margin-bottom:10px;
      border-left:2px solid #4a3a1a; padding-left:10px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width:700px) {
      h1 { font-size:16px; letter-spacing:1px; }
      .modal h2 { font-size:11px; }
      th, td { font-size:13px; padding:6px 4px; }
      .project-name { font-size:14px; }
      .stat-card .value { font-size:22px; }
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>BACHY AIRDROP TRACKER</h1>
    <div class="subtitle">DROPHUNTING MONITOR</div>
    <div class="header-actions">
      <button onclick="toggleTheme()" id="themeBtn">☾ DARK</button>
      <button onclick="exportCSV()">EXPORT CSV</button>
      <button onclick="exportJSON()">BACKUP</button>
      <button onclick="document.getElementById('importFile').click()">RESTORE</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
      <button class="primary" onclick="openAddModal()">+ TAMBAH AIRDROP</button>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats" id="stats"></div>

  <!-- CONTROLS -->
  <div class="controls">
    <input type="text" id="search" placeholder="CARI PROJECT..." oninput="render()">
    <select id="filterStatus" onchange="render()">
      <option value="">SEMUA</option>
      <option value="todo">TODO</option>
      <option value="done">DONE</option>
    </select>
    <select id="filterTaskType" onchange="render()">
      <option value="">SEMUA TASK</option>
<option value="Social">Social</option><option value="Fill The Form">Fill The Form</option><option value="Bounty Platforms">Bounty Platforms</option><option value="Testnet">Testnet</option><option value="Getting a role">Getting a role</option><option value="Trading">Trading</option><option value="Mainnet">Mainnet</option><option value="Liquidity">Liquidity</option><option value="Gaming">Gaming</option><option value="Mint NFT">Mint NFT</option><option value="Ambassador program">Ambassador program</option><option value="Staking">Staking</option><option value="Predictions">Predictions</option><option value="Hold">Hold</option><option value="Node">Node</option><option value="DePIN">DePIN</option><option value="Wallet Airdrop Status">Wallet Airdrop Status</option><option value="Mint Domain">Mint Domain</option><option value="Contract Deployment">Contract Deployment</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="created">TERBARU</option>
      <option value="project">PROJECT</option>
      <option value="cost">COST</option>
    </select>
  </div>


  <!-- A-Z FILTER -->
  <div class="az-bar" id="azBar">
    <button class="az-btn az-active" data-letter="" onclick="filterAZ('')">ALL</button>
    <button class="az-btn" data-letter="A" onclick="filterAZ('A')">A</button>
    <button class="az-btn" data-letter="B" onclick="filterAZ('B')">B</button>
    <button class="az-btn" data-letter="C" onclick="filterAZ('C')">C</button>
    <button class="az-btn" data-letter="D" onclick="filterAZ('D')">D</button>
    <button class="az-btn" data-letter="E" onclick="filterAZ('E')">E</button>
    <button class="az-btn" data-letter="F" onclick="filterAZ('F')">F</button>
    <button class="az-btn" data-letter="G" onclick="filterAZ('G')">G</button>
    <button class="az-btn" data-letter="H" onclick="filterAZ('H')">H</button>
    <button class="az-btn" data-letter="I" onclick="filterAZ('I')">I</button>
    <button class="az-btn" data-letter="J" onclick="filterAZ('J')">J</button>
    <button class="az-btn" data-letter="K" onclick="filterAZ('K')">K</button>
    <button class="az-btn" data-letter="L" onclick="filterAZ('L')">L</button>
    <button class="az-btn" data-letter="M" onclick="filterAZ('M')">M</button>
    <button class="az-btn" data-letter="N" onclick="filterAZ('N')">N</button>
    <button class="az-btn" data-letter="O" onclick="filterAZ('O')">O</button>
    <button class="az-btn" data-letter="P" onclick="filterAZ('P')">P</button>
    <button class="az-btn" data-letter="Q" onclick="filterAZ('Q')">Q</button>
    <button class="az-btn" data-letter="R" onclick="filterAZ('R')">R</button>
    <button class="az-btn" data-letter="S" onclick="filterAZ('S')">S</button>
    <button class="az-btn" data-letter="T" onclick="filterAZ('T')">T</button>
    <button class="az-btn" data-letter="U" onclick="filterAZ('U')">U</button>
    <button class="az-btn" data-letter="V" onclick="filterAZ('V')">V</button>
    <button class="az-btn" data-letter="W" onclick="filterAZ('W')">W</button>
    <button class="az-btn" data-letter="X" onclick="filterAZ('X')">X</button>
    <button class="az-btn" data-letter="Y" onclick="filterAZ('Y')">Y</button>
    <button class="az-btn" data-letter="Z" onclick="filterAZ('Z')">Z</button>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:36px"></th>
          <th style="width:40px">LOGO</th>
          <th>PROJECT</th>
          <th>COST</th>
          <th>TASK TYPE</th>
          <th>AIRDROP LINK</th>
          <th>AKSI</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="empty" id="empty">BELUM ADA AIRDROP. KLIK "+ TAMBAH AIRDROP"</div>

  <!-- ==================== ADD MODAL ==================== -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2>+ TAMBAH AIRDROP</h2>

      <div class="form-group">
        <label>🔗 LINK INFO AIRDROP (CRYPTORANK)</label>
        <input type="url" id="cryptorankUrl" placeholder="https://cryptorank.io/drophunting/..." onchange="fetchFromCR()" onpaste="setTimeout(fetchFromCR,100)">
        <div style="margin-top:6px"><button type="button" class="sm" onclick="fetchFromCR()">⟳ AMBIL DATA</button></div>
      </div>

      <!-- Import Status / Preview -->
      <div id="importStatus"></div>

      <div class="form-group" style="margin-top:14px">
        <label>🔗 LINK AIRDROP YANG AKAN DIKERJAKAN</label>
        <input type="url" id="airdropTaskLink" placeholder="https://..." value="">
      </div>


      <div class="form-group">
        <label>TASK TYPE</label>
        <select id="fTaskType" style="width:100%;font-family:'VT323',monospace;font-size:16px;background:#1a120a;border:2px solid #4a3a1a;color:#d4a017;padding:10px 12px;">
          <option value="">— PILIH TASK —</option>
          <option value="Social">Social</option><option value="Fill The Form">Fill The Form</option><option value="Bounty Platforms">Bounty Platforms</option><option value="Testnet">Testnet</option><option value="Getting a role">Getting a role</option><option value="Trading">Trading</option><option value="Mainnet">Mainnet</option><option value="Liquidity">Liquidity</option><option value="Gaming">Gaming</option><option value="Mint NFT">Mint NFT</option><option value="Ambassador program">Ambassador program</option><option value="Staking">Staking</option><option value="Predictions">Predictions</option><option value="Hold">Hold</option><option value="Node">Node</option><option value="DePIN">DePIN</option><option value="Wallet Airdrop Status">Wallet Airdrop Status</option><option value="Mint Domain">Mint Domain</option><option value="Contract Deployment">Contract Deployment</option>
        </select>
      </div>

      <input type="hidden" id="fProject">
      <input type="hidden" id="fLogoUrl">
      <input type="hidden" id="fCost">
      <input type="hidden" id="fAvailableFrom">
      <input type="hidden" id="editId">

      <div class="modal-actions">
        <button onclick="closeAddModal()">BATAL</button>
        <button class="primary" onclick="saveAirdrop()">SIMPAN</button>
      </div>
    </div>
  </div>

</div>

<script>
const SK = 'bachy_airdrop_data';
const DK = 'bachy_done_map';
let airdrops = [];

// ===== STORAGE =====
function load() { airdrops = JSON.parse(localStorage.getItem(SK) || '[]'); }
function save() { localStorage.setItem(SK, JSON.stringify(airdrops)); }


// ===== A-Z FILTER =====
function filterAZ(letter) {
  document.querySelectorAll('.az-btn').forEach(b => {
    b.classList.toggle('az-active', b.dataset.letter === letter);
  });
  render();
}

// ===== DONE 24H =====
function getDone() { return JSON.parse(localStorage.getItem(DK) || '{}'); }
function saveDone(m) { localStorage.setItem(DK, JSON.stringify(m)); }
function isDone(id) {
  const m = getDone(), t = m[id];
  return t && (Date.now()-t) < 86400000;
}
function toggleDone(id, chk) {
  const m = getDone();
  chk ? m[id]=Date.now() : delete m[id];
  saveDone(m); render();
}

// ===== THEME =====
function toggleTheme() {
  const b = document.body;
  const t = b.getAttribute('data-theme')==='light'?'dark':'light';
  b.setAttribute('data-theme',t);
  localStorage.setItem('bachy_theme',t);
  document.getElementById('themeBtn').textContent = t==='light'?'☀ LIGHT':'☾ DARK';
}
(function() {
  const t = localStorage.getItem('bachy_theme');
  if (t) document.body.setAttribute('data-theme',t);
})();

// ===== RENDER =====
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const fs = document.getElementById('filterStatus').value;
  const ft = document.getElementById('filterTaskType').value;
  const az = document.getElementById('azBar')?.querySelector('.az-active')?.dataset?.letter || '';
  const sb = document.getElementById('sortBy').value;

  let f = airdrops.filter(a => {
    if (fs === 'done') return isDone(a.id);
    if (fs === 'todo') return !isDone(a.id);
    if (az && (a.project||'').charAt(0).toUpperCase() !== az) return false;
    if (ft && a.taskType !== ft) return false;
    if (q) return (a.project+'').toLowerCase().includes(q);
    return true;
  });

  f.sort((a,b) => {
    if (sb==='project') return (a.project||'').localeCompare(b.project||'');
    if (sb==='cost') return (parseInt((a.cost||'').replace(/[^0-9]/g,''))||999) - (parseInt((b.cost||'').replace(/[^0-9]/g,''))||999);
    return b.createdAt - a.createdAt;
  });

  // Stats
  const doneCount = airdrops.filter(x => isDone(x.id)).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">TOTAL</div><div class="value gold">${airdrops.length}</div></div>
    <div class="stat-card"><div class="label">DONE (24J)</div><div class="value green">${doneCount}</div></div>
  `;

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = f.map(a => {
    const done = isDone(a.id);
    return `<tr class="${done?'done-row':''}">
      <td style="text-align:center"><input type="checkbox" ${done?'checked':''} onchange="toggleDone('${a.id}',this.checked)"></td>
      <td class="logo-cell">${a.logoUrl ? `<img src="${esc(a.logoUrl)}" alt="">` : '🪂'}</td>
      <td><span class="project-name">${esc(a.project)}</span>
        ${a.availableFrom ? `<div style="font-size:11px;color:#7a6a3a">${esc(a.availableFrom)}</div>` : ''}
      </td>
      <td class="badge-cost">${esc(a.cost)||'-'}</td>
      <td style="color:#7a6a3a;font-size:13px">${esc(a.taskType)||'-'}</td>
      <td>${a.airdropLink ? `<a href="${esc(a.airdropLink)}" target="_blank" class="airdrop-link">→ BUKA</a>` : '-'}</td>
      <td style="white-space:nowrap">
        <button class="sm" onclick="refreshAirdrop('${a.id}')" title="Refresh dari Cryptorank">⟳</button>
        <button class="sm" onclick="editAirdrop('${a.id}')">EDIT</button>
        <button class="sm danger" onclick="deleteAirdrop('${a.id}')">HAPUS</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('empty').style.display = f.length===0?'block':'none';
}

function esc(s) { return (s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

// ===== MODAL =====
function openAddModal() {
  document.getElementById('editId').value = '';
  document.getElementById('cryptorankUrl').value = '';
  document.getElementById('airdropTaskLink').value = '';
  document.getElementById('importStatus').innerHTML = '';
  document.getElementById('fTaskType').value = '';
  document.getElementById('addModal').classList.add('active');
  document.getElementById('addModal').querySelector('h2').textContent = '+ TAMBAH AIRDROP';
}

function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }

function editAirdrop(id) {
  const a = airdrops.find(x => x.id === id);
  if (!a) return;
  document.getElementById('editId').value = id;
  document.getElementById('cryptorankUrl').value = a.cryptorankUrl || '';
  document.getElementById('airdropTaskLink').value = a.airdropLink || '';
  document.getElementById('fTaskType').value = a.taskType || '';
  document.getElementById('importStatus').innerHTML = a.logoUrl
    ? `<div class="import-preview-card">
        ${a.logoUrl ? `<img src="${esc(a.logoUrl)}" alt="">` : ''}
        <div class="info">
          <div class="name">${esc(a.project)}</div>
          <div class="detail">COST: ${esc(a.cost||'-')}</div>
        </div>
      </div>`
    : '';
  document.getElementById('addModal').classList.add('active');
  document.getElementById('addModal').querySelector('h2').textContent = '✎ EDIT AIRDROP';
}

function deleteAirdrop(id) {
  if (!confirm('HAPUS AIRDROP INI?')) return;
  airdrops = airdrops.filter(a => a.id !== id);
  save(); render();
}

// ===== CRYPTORANK FETCH =====
async function fetchFromCR() {
  const url = document.getElementById('cryptorankUrl').value.trim();
  const stEl = document.getElementById('importStatus');
  if (!url || !url.includes('cryptorank.io/drophunting/')) {
    stEl.innerHTML = '<div class="import-error">MASUKKAN LINK CRYPTORANK DROPHUNTING YANG VALID</div>';
    return;
  }
  stEl.innerHTML = '<div class="import-loading"><div class="spinner"></div> MENGAMBIL DATA...</div>';
  try {
    const api = '/api/scrape?url=' + encodeURIComponent(url);
    let res = await fetch(api);
    let data = await res.json();
    if (!res.ok) throw new Error(data.error);
    if (!data.project && !data.rewardType) throw new Error('TIDAK DAPAT MEMBACA DATA');

    stEl.innerHTML = `<div class="import-preview-card">
      ${data.logoUrl ? `<img src="${esc(data.logoUrl)}" alt="">` : ''}
      <div class="info">
        <div class="name">${esc(data.project)}</div>
        <small>${esc(data.rewardType||'')}</small>
        <div class="detail">COST: ${esc(data.cost||'N/A')}</div>
      </div>
    </div>`;

    document.getElementById('fProject').value = data.project || '';
    document.getElementById('fLogoUrl').value = data.logoUrl || '';
    document.getElementById('fCost').value = data.cost || 'N/A';
    document.getElementById('fAvailableFrom').value = data.availableFrom || '';
    

  } catch(e) {
    stEl.innerHTML = `<div class="import-error">❌ ${esc(e.message)}. ISI MANUAL.</div>`;
  }
}

// ===== SAVE =====
function saveAirdrop() {
  const cryptorankUrl = document.getElementById('cryptorankUrl').value.trim();
  const airdropLink = document.getElementById('airdropTaskLink').value.trim();
  const editId = document.getElementById('editId').value;

  if (!cryptorankUrl) { alert('LINK CRYPTORANK WAJIB DIISI'); return; }

  const data = {
    id: editId || ('a'+Date.now()+Math.random().toString(36).slice(2,6)),
    project: document.getElementById('fProject').value || cryptorankUrl.match(/drophunting\/([^\/\?-]+)/i)?.[1] || 'UNKNOWN',
    taskType: document.getElementById('fTaskType').value,
    logoUrl: document.getElementById('fLogoUrl').value,
    cost: document.getElementById('fCost').value,
    availableFrom: document.getElementById('fAvailableFrom')?.value || '',
    cryptorankUrl,
    airdropLink,
    createdAt: editId ? (airdrops.find(x=>x.id===editId)?.createdAt||Date.now()) : Date.now()
  };

  if (editId) {
    const idx = airdrops.findIndex(x => x.id === editId);
    if (idx>=0) airdrops[idx] = data;
  } else {
    if (airdrops.some(x => x.cryptorankUrl === cryptorankUrl)) {
      if (!confirm('AIRDROP INI SUDAH ADA. TAMBAHKAN DUPLIKAT?')) return;
    }
    airdrops.push(data);
  }
  save(); render(); closeAddModal();
}

// ===== REFRESH FROM CRYPTORANK =====
async function refreshAirdrop(id) {
  const a = airdrops.find(x => x.id === id);
  if (!a || !a.cryptorankUrl) return;
  try {
    const api = '/api/scrape?url=' + encodeURIComponent(a.cryptorankUrl);
    let res = await fetch(api);
    let data = await res.json();
    if (!res.ok) throw new Error(data.error);
    // update fields
    a.project = data.project || a.project;
    a.logoUrl = data.logoUrl || a.logoUrl;
    a.cost = data.cost || a.cost;
    a.availableFrom = data.availableFrom || '';
    a.taskType = data.taskType || a.taskType;
    save(); render();
  } catch(e) {
    alert('GAGAL REFRESH: ' + e.message);
  }
}

// ===== EXPORT / IMPORT =====
function exportJSON() {
  const b = new Blob([JSON.stringify(airdrops,null,2)],{type:'application/json'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href=u; a.download='bachy_airdrop_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(u);
}
function importJSON(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      if (confirm('RESTORE '+d.length+' AIRDROP?')) { airdrops = d; save(); render(); }
    } catch(err) { alert('FILE INVALID: '+err.message); }
  };
  r.readAsText(f);
}
function exportCSV() {
  if (!airdrops.length) { alert('TIDAK ADA DATA'); return; }
  const h = ['Project','Cost','Status','RewardDate','AirdropLink','CryptorankUrl'];
  const rows = airdrops.map(a => [a.project, a.cost, a.status, a.rewardDate, a.airdropLink, a.cryptorankUrl]
    .map(v => '"'+(v||'').replace(/"/g,'""')+'"').join(','));
  const csv = h.join(',')+'\n'+rows.join('\n');
  const b = new Blob([csv],{type:'text/csv'});
  const u = URL.createObjectURL(b);
  const a = document.createElement('a');
  a.href=u; a.download='bachy_airdrop_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  URL.revokeObjectURL(u);
}

// ===== INIT =====
load(); render();
document.getElementById('addModal').addEventListener('click', e => { if(e.target.id==='addModal') closeAddModal(); });
</script>
